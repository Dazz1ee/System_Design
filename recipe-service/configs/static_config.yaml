components_manager:
    coro_pool:
        initial_size: 1000
        max_size: 5000
        stack_size: 167772160
    task_processors:                  # Task processor is an executor for coroutine tasks

        main-task-processor:          # Make a task processor for CPU-bound coroutine tasks.
            worker_threads: $worker-threads         # Process tasks in 4 threads.
        fs-task-processor:            # Make a separate task processor for filesystem bound tasks.
            worker_threads: $worker-fs-threads
        m-task-processor:       # Make a separate task processor for monitoring tasks.
            worker_threads: $worker-monitor-threads
    default_task_processor: main-task-processor

    components:                       # Configuring components that were registered via component_list
        server:
            listener:                 # configuring the main listening socket...
                port: $server-port            # ...to listen on this port and...
                task_processor: main-task-processor    # ...process incoming requests on this task processor.
            listener-monitor:                 # configuring the listener-monitor socket...
                port: $metrics-port            # ...to listen on this port and...
                task_processor: m-task-processor    # ...process incoming requests on this task processor.
        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: '@stderr'
                    level: $logger-level
                    overflow_behavior: discard  # Drop logs if the system is too busy to write them down.

        # Dynamic config options. Cache is disabled, updates are disabled.
        dynamic-config:
            # For most of userver dynamic configs, defaults are used, some are overridden here.
            # See userver "dynamic config" docs for what configs exist.
            defaults:
                HTTP_CLIENT_CONNECTION_POOL_SIZE: 1000
                POSTGRES_DEFAULT_COMMAND_CONTROL:
                    network_timeout_ms: 750
                    statement_timeout_ms: 500

        testsuite-support: {}
        congestion-control:

        http-client:
        http-client-core:
            load-enabled: $is_testing
            fs-task-processor: fs-task-processor

        dns-client:
            fs-task-processor: fs-task-processor

        handler-ping:
            path: /ping
            method: GET
            task_processor: main-task-processor
            throttling_enabled: false
            url_trailing_slash: strict-match

        handler-create-user:
            path: /api/v1/user
            method: POST
            task_processor: main-task-processor
            middlewares:
                pipeline-builder: custom-handler-pipeline-builder
                rate-limit-decorator:
                    rate-limit-value: 5

        handler-login:
            path: /api/v1/login
            method: POST
            task_processor: main-task-processor
            middlewares:
                pipeline-builder: custom-handler-pipeline-builder
                rate-limit-decorator:
                    rate-limit-value: 10

        handler-create-recipe:
            path: /api/v1/recipe
            method: POST
            task_processor: main-task-processor
            auth:
                types:
                    - jwt-auth
            middlewares:
                pipeline-builder: custom-handler-pipeline-builder
                rate-limit-decorator:
                    rate-limit-value: 100

        handler-get-recipes:
            path: /api/v1/recipes
            method: GET
            task_processor: main-task-processor

        handler-get-ingredients:
            path: /api/v1/recipes/{id}/ingredients
            method: GET
            task_processor: main-task-processor

        handler-create-recipe-v2:
            path: /api/v2/recipe
            method: POST
            task_processor: main-task-processor
            auth:
                types:
                    - jwt-auth
            middlewares:
                pipeline-builder: custom-handler-pipeline-builder
                rate-limit-decorator:
                    rate-limit-value: 100

        handler-get-recipes-v2:
            path: /api/v2/recipes
            method: GET
            task_processor: main-task-processor

        handler-get-ingredients-v2:
            path: /api/v2/recipes/{id}/ingredients
            method: GET
            task_processor: main-task-processor

        handler-server-monitor:
            path: /metrics
            method: GET
            task_processor: m-task-processor
            common-labels:
                application: recipe-service
            format: prometheus

        db-service:
            load-enabled: true
            enable_postgres: $enable_postgres
        in-memory-db-service:
            load-enabled: true
        postgres-db-service:
            load-enabled: true
        mongo-db-service:
            load-enabled: true
        recipe-service:
            load-enabled: true
        user-service:
            load-enabled: true
        auth-service:
            load-enabled: true
            base-url: $auth-service-url
            base-url#env: AUTH_SERVICE_URL
        jwt-auth-checker:
            load-enabled: true
        ingredient-cache-service:
            load-enabled: true
        recipe-cache-service:
            load-enabled: true
        pg-ingredient-cache-service:
            load-enabled: true
        pg-recipe-cache-service:
            load-enabled: true
        rate-limit-cache-service:
            load-enabled: true
        rate-limit-decorator:
            load-enabled: true
        recipe-producer-job:
            load-enabled: true

        postgres-db-1:
            dbconnection: $pg-connection
            dbconnection#env: DB_CONNECTION
            blocking_task_processor: fs-task-processor
            dns_resolver: async
            sync-start: true
        mongo-db:
            dbconnection: $pg-connection
            dbconnection#env: MONGO_DB_CONNECTION
        mongo-write-db:
            dbconnection: $mongo-write-connection
            dbconnection#env: MONGO_WRITE_DB_CONNECTION
        redis-database:
            groups:
                - config_name: ingredient
                  db: ingredient
                  sharding_strategy: RedisStandalone
                - config_name: recipe
                  db: recipe
                  sharding_strategy: RedisStandalone
                - config_name: rate-limit
                  db: rate-limit
                  sharding_strategy: RedisStandalone
            thread_pools:
                redis_thread_pool_size: 2
                sentinel_thread_pool_size: 1
            subscribe_groups: []

        default-secdist-provider:
            config: /app/configs/secure_data.json
            missing-ok: false

        custom-handler-pipeline-builder:
            load-enabled: true

        recipe-rabbit:
            min_pool_size: 1
            max_pool_size: 2
            max_in_flight_requests: 2
            secdist_alias: recipe-rabbit
            use_secure_connection: false

        recipe-created-consumer:
            load-enabled: true
            rabbit_name: recipe-rabbit
            queue: recipe.queue
            prefetch_count: 2