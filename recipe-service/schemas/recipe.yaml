openapi: 3.1.0
info:
  title: Title
  description: Title
  version: 1.0.0
components:
  schemas:
    CreateRecipeRequestDTO:
      type: object
      required:
        - title
        - ingredients
        - steps
      properties:
        title:
          type: string
        description:
          type: string
        servings:
          type: integer
        cookTimeMinutes:
          type: integer
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/CreateIngredientDTO'
        steps:
          type: array
          items:
            type: string
    CreateRecipeRequestV2DTO:
      type: object
      required:
        - title
        - ingredients
        - steps
      properties:
        title:
          type: string
        description:
          type: string
        servings:
          type: integer
        cookTimeMinutes:
          type: integer
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/CreateIngredientV2DTO'
        steps:
          type: array
          items:
            type: string
    CreateIngredientDTO:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
        quantity:
          $ref: '#/components/schemas/IngredientQuantityDTO'
    CreateIngredientV2DTO:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        quantity:
          $ref: '#/components/schemas/IngredientQuantityDTO'
    IngredientQuantityDTO:
      type: object
      properties:
        amount:
          type: number
          format: float
        unit:
          type: string
    CreateRecipeResponseDTO:
      type: object
      required:
        - id
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    CreateRecipeResponseV2DTO:
      type: object
      required:
        - id
        - createdAt
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
    GetRecipesResponseDTO:
      type: object
      properties:
        recipes:
          type: array
          items:
            $ref: '#/components/schemas/RecipeResponseDTO'
    GetRecipesResponseV2DTO:
      type: object
      properties:
        recipes:
          type: array
          items:
            $ref: '#/components/schemas/RecipeResponseV2DTO'
    RecipeResponseDTO:
      type: object
      required:
        - id
        - title
        - steps
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        servings:
          type: integer
        cookTimeMinutes:
          type: integer
        steps:
          type: array
          items:
            type: string
