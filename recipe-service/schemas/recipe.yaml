          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    RecipeResponseV2DTO:
      type: object
      required:
        - id
        - title
        - steps
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        servings:
          type: integer
        cookTimeMinutes:
          type: integer
        steps:
          type: array
          items:
            type: string
        authorId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
