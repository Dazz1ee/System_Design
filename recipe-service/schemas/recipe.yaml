      type: object
      required:
        - ingredients
      properties:
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/IngredientDTO'
    IngredientDTO:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        amount:
