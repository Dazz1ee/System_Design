    GetIngredientsResponseV2DTO:
      type: object
      required:
        - ingredients
      properties:
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/IngredientV2DTO'
    IngredientV2DTO:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        amount:
          type: number
          format: float
        unit:
          type: string